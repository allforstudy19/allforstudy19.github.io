<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>单词练习工具</title>
<!-- PWA 配置 -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="white">
<meta name="apple-mobile-web-app-title" content="单词练习">
<link rel="apple-touch-icon" href="icon.png">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  background: #ffffff;
  min-height: 100vh;
  padding-bottom: 110px;
}

.app-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px;
}

.mode-tag {
  display: inline-block;
  background: #0099ff;
  color: #ffffff;
  font-family: "幼圆", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  padding: 6px 12px;
  border-radius: 999px;
  letter-spacing: 1px;
  margin-bottom: 16px;
}

.bottom-dock {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 16px;
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(14px);
  border-radius: 20px;
  padding: 8px 10px;
  display: flex;
  gap: 6px;
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.12);
}

.setting-panel {
  position: fixed;
  bottom: calc(16px + 56px + 8px);
  width: 240px;
  background: #ffffff;
  border: 1px solid #e5e5e5;
  border-radius: 14px;
  overflow: hidden;
  display: none;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  z-index: 999;
}

.setting-panel.show {
  display: block;
}

.setting-item {
  padding: 12px 16px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  color: #000000;
  font-size: 16px;
  border-bottom: 1px solid #f1f1f1;
  cursor: pointer;
}

.setting-item:last-child {
  border-bottom: none;
}

.import-area {
  padding: 12px 16px;
}

.import-area textarea {
  width: 100%;
  height: 100px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  margin-bottom: 8px;
}

.import-area input[type="file"] {
  font-size: 13px;
}

.word-container {
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

#wordTextDisplay {
  font-size: clamp(42px,18vw,120px);
  color: #000000;
  font-weight: normal;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  transition: color 0.25s ease;
}
#wordTextDisplay.orange {
  color:#ff7800;
}
#wordTextDisplay.green {
  color:#22c55e;
}

#answerTip {
  margin-top:12px;
  font-size: clamp(18px,5vw,28px);
  color:#000000;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
}

.dock-btn {
  width: 52px;
  height: 52px;
  background: #ffffff;
  border: none;
  border-radius: 12px;
  color: #0099ff;
  font-family: "幼圆", "Microsoft YaHei", sans-serif;
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.15s ease;
}

.dock-btn:active {
  transform: scale(1.08);
}

.fullscreen-container:-webkit-full-screen {
  background: #ffffff;
}
.fullscreen-container:-webkit-full-screen .mode-tag,
.fullscreen-container:-webkit-full-screen .setting-panel,
.fullscreen-container:-webkit-full-screen .bottom-dock {
  display: none !important;
}
.fullscreen-container:-webkit-full-screen .word-container {
  min-height: 100vh;
}
</style>
</head>

<body>
<div class="fullscreen-container" id="fullWrap">
  <div class="app-wrap">
    <div class="mode-tag" id="modeTag">准备开始</div>

    <div class="word-container">
      <div id="wordTextDisplay">准备开始</div>
      <div id="answerTip"></div>
    </div>
  </div>
</div>

<div class="setting-panel" id="settingPanel">
  <div class="setting-item" id="importWord">导入单词</div>
  <div class="setting-item" data-mode="read">READ WORDS</div>
  <div class="setting-item" data-mode="en2cn">SAY CHINESE</div>
  <div class="setting-item" data-mode="cn2en">SAY ENGLISH</div>
  <div class="setting-item" data-mode="listenSay">LISTEN&SAY</div>
  <div class="setting-item" data-mode="spell">SPELL WORDS</div>
  <div class="import-area" id="importBlock">
    <textarea id="wordInput">apple,苹果|苹果树
banana,香蕉
cat,猫
dog,狗
book,书</textarea>
    <input type="file" id="fileUpload" accept=".txt" />
  </div>
</div>

<div class="bottom-dock" id="dockWrap">
  <button class="dock-btn" id="startBtn">START</button>
  <button class="dock-btn" id="pauseBtn">PAUSE</button>
  <button class="dock-btn" id="stopBtn">STOP</button>
  <button class="dock-btn" id="againBtn">AGAIN</button>
  <button class="dock-btn" id="scoreBtn">SCORE</button>
  <button class="dock-btn" id="fullBtn">全屏</button>
  <button class="dock-btn" id="settingBtn">设置</button>
</div>

<script>
const modeTag = document.getElementById("modeTag");
const settingBtn = document.getElementById("settingBtn");
const settingPanel = document.getElementById("settingPanel");
const importWordItem = document.getElementById("importWord");
const importBlock = document.getElementById("importBlock");
const wordInput = document.getElementById("wordInput");
const fileUpload = document.getElementById("fileUpload");
const wordTextDisplay = document.getElementById("wordTextDisplay");
const answerTip = document.getElementById("answerTip");
const fullWrap = document.getElementById("fullWrap");
const dockWrap = document.getElementById("dockWrap");

const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const stopBtn = document.getElementById("stopBtn");
const againBtn = document.getElementById("againBtn");
const scoreBtn = document.getElementById("scoreBtn");
const fullBtn = document.getElementById("fullBtn");

let wordList = [];
let currentWordIndex = 0;
let currentTry = 0;
let gameMode = "read";
let isRunning = false;
let isPaused = false;
let spellBuffer = "";
let recognition = null;
let isListening = false;

const modeNames = {
  read: "READ WORDS",
  en2cn: "SAY CHINESE",
  cn2en: "SAY ENGLISH",
  listenSay: "LISTEN&SAY",
  spell: "SPELL WORDS"
};

function updateDockSize() {
  const rect = dockWrap.getBoundingClientRect();
  settingPanel.style.left = `${rect.right - 240}px`;
}
updateDockSize();
window.addEventListener('resize', updateDockSize);
window.addEventListener('orientationchange', ()=>{
  setTimeout(updateDockSize,100);
});

settingBtn.onclick = () => {
  updateDockSize();
  settingPanel.classList.toggle("show");
};

importWordItem.onclick = () => {
  importBlock.style.display = importBlock.style.display === "none" ? "block" : "none";
};

document.querySelectorAll(".setting-item[data-mode]").forEach(item => {
  item.onclick = () => {
    gameMode = item.dataset.mode;
    modeTag.textContent = modeNames[gameMode];
    settingPanel.classList.remove("show");
    resetDisplay();
  };
});

function resetDisplay() {
  wordTextDisplay.classList.remove("orange", "green");
  wordTextDisplay.style.color = "#000000";
  answerTip.textContent = "";
  spellBuffer = "";
  currentTry = 0;
  stopRecognition();
}

function parseWords() {
  const lines = wordInput.value.trim().split("\n");
  const arr = [];
  lines.forEach(line => {
    const sp = line.split(/[,，]/);
    if (sp.length >= 2) {
      const cnArr = sp[1].trim().split(/[|｜]/).map(s => s.trim());
      arr.push({
        en: sp[0].trim(),
        cn: cnArr
      });
    }
  });
  return arr;
}

fileUpload.onchange = function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    wordInput.value = evt.target.result;
  };
  reader.readAsText(file);
};

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    alert("浏览器不支持语音朗读");
    return;
  }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  utter.rate = 0.9;
  speechSynthesis.speak(utter);
}

function stopRecognition() {
  isListening = false;
  if (recognition) {
    try { recognition.stop(); } catch (e) {}
    recognition = null;
  }
}

function startRecognition(lang, onResultCallback) {
  if (isListening) return;
  if (!("webkitSpeechRecognition" in window) && !("SpeechRecognition" in window)) {
    alert("当前浏览器不支持语音识别！苹果手机必须把网页添加到主屏幕PWA并且HTTPS访问");
    return;
  }
  stopRecognition();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = lang;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  isListening = true;

  recognition.onresult = function (event) {
    const transcript = event.results[0][0].transcript.trim();
    isListening = false;
    onResultCallback(transcript);
  };

  recognition.onerror = function (e) {
    console.log("语音识别错误：", e.error);
    isListening = false;
  };

  recognition.onend = function () {
    isListening = false;
  };

  try {
    recognition.start();
  } catch (err) {
    isListening = false;
  }
}

function normalizeText(text) {
  return text.toLowerCase().replace(/[.,!?\s]/g, "").trim();
}

function loadWord() {
  resetDisplay();
  if (currentWordIndex >= wordList.length) {
    wordTextDisplay.textContent = "你太棒了！继续加油吧！";
    answerTip.textContent = "";
    isRunning = false;
    return;
  }
  const w = wordList[currentWordIndex];
  currentTry = 0;
  switch (gameMode) {
    case "read":
      wordTextDisplay.textContent = w.en;
      answerTip.textContent = "";
      setTimeout(()=> startRecognition("en-US", checkRead), 400);
      break;
    case "en2cn":
      wordTextDisplay.textContent = w.en;
      answerTip.textContent = "";
      setTimeout(()=> startRecognition("zh-CN", checkEn2Cn), 400);
      break;
    case "cn2en":
      wordTextDisplay.textContent = w.cn.join("；");
      answerTip.textContent = "";
      setTimeout(()=> startRecognition("en-US", checkCn2En), 400);
      break;
    case "listenSay":
      wordTextDisplay.textContent = "";
      answerTip.textContent = "";
      speakText(w.en);
      setTimeout(()=> startRecognition("zh-CN", checkListenSay), 1200);
      break;
    case "spell":
      wordTextDisplay.textContent = "";
      answerTip.textContent = "";
      speakText(w.en);
      setTimeout(()=> startRecognition("en-US", checkSpell),1200);
      break;
  }
}

function checkRead(userSpeech) {
  if (!isRunning || isPaused) return;
  const w = wordList[currentWordIndex];
  const input = normalizeText(userSpeech);
  const target = normalizeText(w.en);
  if(input === target){
    wordTextDisplay.classList.add("green");
    setTimeout(()=>{
      currentWordIndex++;
      loadWord();
    },800);
  }else{
    wordTextDisplay.classList.add("orange");
    setTimeout(()=> startRecognition("en-US", checkRead), 600);
  }
}

function checkEn2Cn(userSpeech) {
  if (!isRunning || isPaused) return;
  const w = wordList[currentWordIndex];
  const input = userSpeech.trim();
  const correct = w.cn.some(item => input.includes(item));
  if(correct){
    wordTextDisplay.classList.add("green");
    setTimeout(()=>{
      currentWordIndex++;
      loadWord();
    },800);
  }else{
    wordTextDisplay.classList.add("orange");
    setTimeout(()=> startRecognition("zh-CN", checkEn2Cn), 600);
  }
}

function checkCn2En(userSpeech) {
  if (!isRunning || isPaused) return;
  const w = wordList[currentWordIndex];
  const input = normalizeText(userSpeech);
  const target = normalizeText(w.en);
  if(input === target){
    wordTextDisplay.classList.add("green");
    setTimeout(()=>{
      currentWordIndex++;
      loadWord();
    },800);
  }else{
    wordTextDisplay.classList.add("orange");
    setTimeout(()=> startRecognition("en-US", checkCn2En), 600);
  }
}

function checkListenSay(userSpeech) {
  if (!isRunning || isPaused) return;
  const w = wordList[currentWordIndex];
  const input = userSpeech.trim();
  const correct = w.cn.some(item => input.includes(item));
  if(correct){
    wordTextDisplay.textContent = w.en;
    answerTip.textContent = w.cn.join("；");
    wordTextDisplay.classList.add("green");
    setTimeout(()=>{
      currentWordIndex++;
      loadWord();
    },1200);
  }else{
    speakText(w.en);
    setTimeout(()=> startRecognition("zh-CN", checkListenSay), 1200);
  }
}

function checkSpell(userSpeech) {
  if (!isRunning || isPaused) return;
  const w = wordList[currentWordIndex];
  const target = normalizeText(w.en);
  const letter = normalizeText(userSpeech);
  if(target.startsWith(spellBuffer + letter)){
    spellBuffer += letter;
    wordTextDisplay.textContent = spellBuffer.toUpperCase();
    if(spellBuffer === target){
      wordTextDisplay.classList.add("green");
      setTimeout(()=>{
        currentWordIndex++;
        loadWord();
      },800);
    }else{
      setTimeout(()=> startRecognition("en-US", checkSpell),400);
    }
  }else{
    wordTextDisplay.classList.add("orange");
    setTimeout(()=> startRecognition("en-US", checkSpell), 600);
  }
}

startBtn.onclick = () => {
  wordList = parseWords();
  if (wordList.length === 0) {
    alert("请先导入单词！");
    return;
  }
  isRunning = true;
  isPaused = false;
  currentWordIndex = 0;
  modeTag.textContent = modeNames[gameMode];
  loadWord();
};

pauseBtn.onclick = () => {
  isPaused = !isPaused;
  if (isPaused) {
    stopRecognition();
    wordTextDisplay.textContent = "已暂停";
    answerTip.textContent = "";
  } else {
    loadWord();
  }
};

stopBtn.onclick = () => {
  isRunning = false;
  isPaused = false;
  currentWordIndex = 0;
  spellBuffer = "";
  stopRecognition();
  modeTag.textContent = "准备开始";
  wordTextDisplay.textContent = "准备开始";
  answerTip.textContent = "";
};

againBtn.onclick = () => {
  currentWordIndex = 0;
  spellBuffer = "";
  loadWord();
};

scoreBtn.onclick = () => {
  alert(`当前进度：${currentWordIndex} / ${wordList.length}`);
};

fullBtn.onclick = async () => {
  try {
    if (!document.fullscreenElement) {
      await fullWrap.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (e) {
    alert("全屏切换失败");
  }
};

document.addEventListener("click", (e) => {
  if (!settingPanel.contains(e.target) && e.target !== settingBtn) {
    settingPanel.classList.remove("show");
  }
});

document.body.onkeydown = function (e) {
  if (e.key === "Enter" && isRunning && !isPaused) {
    const ans = prompt("手动输入答案：");
    if(ans === null) return;
    switch(gameMode){
      case "read": checkRead(ans); break;
      case "en2cn": checkEn2Cn(ans); break;
      case "cn2en": checkCn2En(ans); break;
      case "listenSay": checkListenSay(ans); break;
      case "spell": checkSpell(ans); break;
    }
  }
};

// PWA ServiceWorker注册
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js');
  });
}
</script>
</body>
</html>
