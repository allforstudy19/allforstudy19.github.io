<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>单词练习工具</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="white">
<meta name="apple-mobile-web-app-title" content="单词练习">
<link rel="apple-touch-icon" href="icon.png">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}
html, body {
  background-color: #ffffff !important;
  min-height: 100vh;
  background: #ffffff;
  overflow-x: hidden;
}

body {
  padding-bottom: 110px;
  background: #fff;
}

.app-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px;
}

.mode-tag {
  display: inline-block;
  background: #007AFF;
  color: #ffffff;
  font-family: "幼圆", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  padding: 6px 12px;
  border-radius: 999px;
  letter-spacing: 1px;
  margin-bottom: 16px;
}

.bottom-dock {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 16px;
  background: #ffffff;
  border-radius: 20px;
  padding: 8px 10px;
  display: flex;
  gap: 6px;
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.12);
}

/* ========== 设置面板 ========== */
.setting-panel {
  position: fixed;
  bottom: calc(16px + 56px + 8px);
  right: 16px;
  width: 220px;
  max-width: 86vw;
  background: #ffffff;
  border: 1px solid #e5e5e5;
  border-radius: 14px;
  overflow: hidden;
  display: none;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  z-index: 999;
}
.setting-panel.show {
  display: block;
}
.setting-item {
  padding: 12px 16px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  color: #000000;
  font-size: 16px;
  border-bottom: 1px solid #f1f1f1;
  cursor: pointer;
  white-space: nowrap;
}
.setting-item:last-child {
  border-bottom: none;
}

.import-area {
  padding: 12px 16px;
}
.import-area textarea {
  width: 100%;
  height: 100px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 14px;
  outline: none;
  margin-bottom: 8px;
}
.import-area input[type="file"] {
  font-size: 13px;
}

.word-container {
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

/* 卡片切换动画 */
.card-wrap {
  transition: all 0.35s ease;
  opacity: 1;
  transform: translateY(0px);
}
.card-wrap.fade-out {
  opacity: 0;
  transform: translateY(12px);
}

#wordTextDisplay {
  font-size: clamp(42px,18vw,120px);
  color: #000000;
  font-weight: normal;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
}
#answerTip {
  margin-top:12px;
  font-size: clamp(18px,5vw,28px);
  color:#000000;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
}
.answer-listen-meaning{
  font-size: clamp(24px,7vw,36px);
}
.cn2en-init-text{
  font-size: clamp(32px,12vw,80px);
}

/* ========== 聊天气泡样式，带尖角 ========== */
.chat-box{
  display:flex;
  flex-direction:column;
  gap:18px;
  margin:20px 0;
  width:100%;
  padding:0 10px;
}
/* 右侧 用户气泡：苹果天蓝色，微信尖角 */
.bubble-right{
  position:relative;
  align-self:flex-end;
  background:#007AFF;
  color:#fff;
  padding:10px 14px;
  border-radius:16px 4px 16px 16px;
  max-width:70%;
}
.bubble-right::after{
  content:"";
  position:absolute;
  right:-8px;
  bottom:0px;
  border-width:8px 0 0 8px;
  border-style:solid;
  border-color: transparent transparent transparent #007AFF;
}
/* 左侧 APP回复气泡：半透明磨砂，Mac Dock质感，尖角 */
.bubble-left{
  position:relative;
  align-self:flex-start;
  background:rgba(255,255,255,0.65);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color:#000;
  padding:10px 14px;
  border-radius:4px 16px 16px 16px;
  max-width:70%;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.bubble-left::after{
  content:"";
  position:absolute;
  left:-8px;
  bottom:0px;
  border-width:8px 8px 0 0;
  border-style:solid;
  border-color: transparent rgba(255,255,255,0.65) transparent transparent;
}

.dock-btn {
  width: 52px;
  height: 52px;
  background: #ffffff;
  border: 1px solid #eee;
  border-radius: 12px;
  color: #007AFF;
  font-family: "幼圆", "Microsoft YaHei", sans-serif;
  font-size: 10px;
  font-weight: bold;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.15s ease;
}

.dock-btn:active {
  transform: scale(0.96);
}

.fullscreen-container:-webkit-full-screen {
  background: #ffffff;
}
.fullscreen-container:-webkit-full-screen .mode-tag,
.fullscreen-container:-webkit-full-screen .setting-panel,
.fullscreen-container:-webkit-full-screen .bottom-dock {
  display: none !important;
}
.fullscreen-container:-webkit-full-screen .word-container {
  min-height: 100vh;
}
</style>
</head>

<body>
<div class="fullscreen-container" id="fullWrap">
  <div class="app-wrap">
    <div class="mode-tag" id="modeTag">准备开始</div>

    <div class="word-container" id="wordContainer">
      <div class="card-wrap" id="cardWrap">
        <div id="wordTextDisplay">准备开始</div>
        <div id="answerTip"></div>
      </div>
    </div>
  </div>
</div>

<div class="setting-panel" id="settingPanel">
  <div class="setting-item" id="importWord">导入单词</div>
  <div class="setting-item" data-mode="listenWrite">LISTEN AND WRITE</div>
  <div class="setting-item" data-mode="sayChinese">SAY CHINESE</div>
  <div class="setting-item" data-mode="sayEnglish">SAY ENGLISH</div>
  <div class="import-area" id="importBlock">
    <textarea id="wordInput">apple,苹果|苹果树
banana,香蕉
cat,猫
dog,狗
book,书</textarea>
    <input type="file" id="fileUpload" accept=".txt" />
  </div>
</div>

<div class="bottom-dock" id="dockWrap">
  <button class="dock-btn" id="startBtn">START</button>
  <button class="dock-btn" id="lastBtn">LAST</button>
  <button class="dock-btn" id="nextBtn">NEXT</button>
  <button class="dock-btn" id="againBtn">AGAIN</button>
  <button class="dock-btn" id="scoreBtn">SCORE</button>
  <button class="dock-btn" id="fullBtn">全屏</button>
  <button class="dock-btn" id="settingBtn">设置</button>
</div>

<script>
const modeTag = document.getElementById("modeTag");
const settingBtn = document.getElementById("settingBtn");
const settingPanel = document.getElementById("settingPanel");
const importWordItem = document.getElementById("importWord");
const importBlock = document.getElementById("importBlock");
const wordInput = document.getElementById("wordInput");
const fileUpload = document.getElementById("fileUpload");
const wordTextDisplay = document.getElementById("wordTextDisplay");
const answerTip = document.getElementById("answerTip");
const fullWrap = document.getElementById("fullWrap");
const wordContainer = document.getElementById("wordContainer");
const cardWrap = document.getElementById("cardWrap");

// 音效
const audioFinish = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3");
const audioVlogHum = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-software-interface-warming-2568.mp3");
function playSound(audioObj){
  audioObj.currentTime = 0;
  audioObj.play().catch(e=>{});
}

let wordList = [];
let currentWordIndex = 0;
let gameMode = "listenWrite";
let isRunning = false;
let timer = null;

const modeNames = {
  listenWrite: "LISTEN AND WRITE",
  sayChinese: "SAY CHINESE",
  sayEnglish: "SAY ENGLISH"
};

// 释义渲染，| 转为换行
function renderMeaning(cnArr){
  return cnArr.join("<br>");
}

settingBtn.onclick = () => {
  settingPanel.classList.toggle("show");
};

importWordItem.onclick = () => {
  importBlock.style.display = importBlock.style.display === "none" ? "block" : "none";
};

document.querySelectorAll(".setting-item[data-mode]").forEach(item => {
  item.onclick = () => {
    gameMode = item.dataset.mode;
    modeTag.textContent = modeNames[gameMode];
    settingPanel.classList.remove("show");
    resetDisplay();
  };
});

function resetDisplay() {
  answerTip.textContent = "";
  answerTip.className = "";
  clearTimeout(timer);
}

function parseWords() {
  const lines = wordInput.value.trim().split("\n");
  const arr = [];
  lines.forEach(line => {
    const sp = line.split(/[,，]/);
    if (sp.length >= 2) {
      const cnArr = sp[1].trim().split(/[|｜]/).map(s => s.trim());
      arr.push({
        en: sp[0].trim(),
        cn: cnArr
      });
    }
  });
  return arr;
}

fileUpload.onchange = function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    wordInput.value = evt.target.result;
  };
  reader.readAsText(file);
};

// 卡片切换动画
function showCard(callback){
  cardWrap.classList.add("fade-out");
  setTimeout(()=>{
    callback();
    cardWrap.classList.remove("fade-out");
  },350);
}

// 加载单词逻辑
function loadWord() {
  resetDisplay();
  if (currentWordIndex >= wordList.length) {
    // 全部单词完成：对话气泡
    playSound(audioVlogHum);
    playSound(audioFinish);
    wordTextDisplay.innerHTML = `
      <div class="chat-box">
        <div class="bubble-right">Well, I've finished.</div>
        <div class="bubble-left">I knew it. You're the best.</div>
      </div>`;
    answerTip.textContent = "";
    isRunning = false;
    return;
  }
  if(currentWordIndex < 0) currentWordIndex = 0;
  const w = wordList[currentWordIndex];

  switch (gameMode) {
    case "listenWrite":
      wordTextDisplay.textContent = "✍️ 写完点屏幕";
      answerTip.textContent = "";
      // 点击屏幕显示单词+释义
      wordContainer.onclick = function showAnswer(){
        wordTextDisplay.textContent = w.en;
        answerTip.innerHTML = renderMeaning(w.cn);
        wordContainer.onclick = null;
      }
      break;
    case "sayChinese":
      wordTextDisplay.textContent = w.en;
      answerTip.textContent = "";
      // 3秒后显示中文
      timer = setTimeout(()=>{
        answerTip.innerHTML = renderMeaning(w.cn);
      },3000);
      wordContainer.onclick = null;
      break;
    case "sayEnglish":
      wordTextDisplay.innerHTML = `<span class="cn2en-init-text">${renderMeaning(w.cn)}</span>`;
      answerTip.textContent = "";
      //3秒后显示英文
      timer = setTimeout(()=>{
        wordTextDisplay.textContent = w.en;
      },3000);
      wordContainer.onclick = null;
      break;
  }
}

// 底部按钮
const startBtn = document.getElementById("startBtn");
const lastBtn = document.getElementById("lastBtn");
const nextBtn = document.getElementById("nextBtn");
const againBtn = document.getElementById("againBtn");
const scoreBtn = document.getElementById("scoreBtn");
const fullBtn = document.getElementById("fullBtn");

startBtn.onclick = () => {
  wordList = parseWords();
  if (wordList.length === 0) {
    alert("请先导入单词！");
    return;
  }
  isRunning = true;
  currentWordIndex = 0;
  modeTag.textContent = modeNames[gameMode];
  showCard(()=> loadWord());
};

lastBtn.onclick = () => {
  if(!isRunning) return;
  currentWordIndex--;
  showCard(()=> loadWord());
};

nextBtn.onclick = () => {
  if(!isRunning) return;
  currentWordIndex++;
  showCard(()=> loadWord());
};

againBtn.onclick = () => {
  if(!isRunning) return;
  currentWordIndex = 0;
  showCard(()=> loadWord());
};

scoreBtn.onclick = () => {
  if(wordList.length ===0){
    alert("还没有导入单词");
    return;
  }
  alert(`当前进度：${currentWordIndex+1} / ${wordList.length}`);
};

fullBtn.onclick = async () => {
  try {
    if (!document.fullscreenElement) {
      await fullWrap.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (e) {
    alert("全屏切换失败");
  }
};

document.addEventListener("click", (e) => {
  if (!settingPanel.contains(e.target) && e.target !== settingBtn) {
    settingPanel.classList.remove("show");
  }
});
</script>
</body>
</html>
