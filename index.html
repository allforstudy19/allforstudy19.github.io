<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>EASYWORD</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{background:#ffffff;padding-bottom:90px;min-height:100vh;}
.container{padding:20px;max-width:700px;margin:0 auto;}
.title{text-align:center;margin-bottom:24px;font-size:28px;color:#222;}
.mode-select{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
.mode-btn{padding:14px;border-radius:12px;border:none;background:#e8edf7;font-size:16px;cursor:pointer;transition:0.2s;}
.mode-btn.active{background:#2563eb;color:white;}
.card{background:#ffffff;border-radius:18px;padding:24px;box-shadow:0 4px 16px rgba(0,0,0,0.08);margin-bottom:20px;}
.word-text{font-size:36px;text-align:center;margin:16px 0;}
.meaning-text{line-height:1.6;margin:10px 0;text-align:center;}
/* SAY ENGLISH 汉字缩小字号 */
.say-eng-meaning{font-size:18px;}
/* LISTEN&SAY 中文释义放大一号 */
.listen-meaning{font-size:40px;}
/* 答对绿色，答错橙色 */
.correct{color:#22a75d;}
.wrong{color:#f27c22;}
/* 对话气泡样式 */
.chat-box{display:flex;flex-direction:column;gap:12px;margin:20px 0;}
.bubble-left{align-self:flex-start;background:#87CEEB;color:#000;padding:10px 14px;border-radius:16px;max-width:70%;}
.bubble-right{align-self:flex-end;background:rgba(200,200,200,0.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:10px 14px;border-radius:16px;max-width:70%;}
/* Mac风格半透明底部栏 */
.bottom-bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,0.4);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);padding:14px 20px;display:flex;gap:10px;justify-content:center;}
.bottom-btn{padding:10px 18px;border-radius:10px;border:none;background:rgba(255,255,255,0.6);font-size:16px;cursor:pointer;}
/* 设置面板缩窄，自适应内容宽度 */
.setting-panel{position:fixed;top:0;right:0;height:100%;background:white;padding:24px;width:fit-content;max-width:90%;box-shadow:-4px 0 20px rgba(0,0,0,0.1);transform:translateX(100%);transition:transform 0.3s;z-index:99;}
.setting-panel.open{transform:translateX(0);}
.setting-item{margin-bottom:16px;display:flex;gap:8px;align-items:center;white-space:nowrap;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:none;z-index:98;}
.overlay.show{display:block;}
/* SPELL WORDS 小写字母 */
.spell-input{text-transform:lowercase;text-align:center;font-size:28px;padding:10px;width:100%;border:2px solid #ddd;border-radius:12px;margin:12px 0;outline:none;}
.mic-btn{width:80px;height:80px;border-radius:50%;border:none;background:#2563eb;color:white;font-size:28px;margin:12px auto;display:block;cursor:pointer;}
</style>
</head>
<body>
<div class="container">
<h1 class="title">EASYWORD</h1>
<div class="mode-select">
<button class="mode-btn" data-mode="read">READ WORDS</button>
<button class="mode-btn" data-mode="saycn">SAY CHINESE</button>
<button class="mode-btn" data-mode="sayen">SAY ENGLISH</button>
<button class="mode-btn" data-mode="listen">LISTEN&SAY</button>
<button class="mode-btn" data-mode="spell">SPELL WORDS</button>
</div>
<div class="card" id="mainCard">
<div id="content"></div>
</div>
</div>

<!-- 设置面板 -->
<div class="overlay" id="overlay"></div>
<div class="setting-panel" id="settingPanel">
<h3 style="margin-bottom:20px;">设置</h3>
<div class="setting-item">
<input type="checkbox" id="soundSwitch">
<label for="soundSwitch">提示音</label>
</div>
<button class="bottom-btn" id="closeSetting">关闭</button>
</div>

<!-- 底部Mac半透明栏 -->
<div class="bottom-bar">
<button class="bottom-btn" id="settingBtn">设置</button>
<button class="bottom-btn" id="nextBtn">下一个</button>
</div>

<script>
// ========== 单词库示例，你可以继续扩充 ==========
const wordList = [
  {en:"apple",cn:"苹果；苹果树"},
  {en:"banana",cn:"香蕉；芭蕉树"},
  {en:"cat",cn:"猫；猫咪"},
  {en:"dog",cn:"狗；小狗"},
  {en:"book",cn:"书；书籍"},
];
let currentMode = "read";
let currentIndex = 0;
let soundOn = true;
const contentEl = document.getElementById("content");
const soundSwitch = document.getElementById("soundSwitch");
soundSwitch.checked = true;
soundSwitch.addEventListener("change",e=>soundOn = e.target.checked);

// 音频资源：苹果怪诞 / 欢迎提示音
const audioCorrect = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3");
const audioFinish = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3");
function playSound(audioObj){
  if(soundOn){
    audioObj.currentTime=0;
    audioObj.play().catch(e=>{});
  }
}

// 渲染释义，多个释义一行一个
function renderMeaning(str){
  return str.split(";").map(item=>item.trim()).join("<br>");
}

// 切换模式
document.querySelectorAll(".mode-btn").forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    currentMode = btn.dataset.mode;
    currentIndex = 0;
    renderWord();
  }
});

// 渲染单词逻辑
function renderWord(){
  const w = wordList[currentIndex];
  let html = "";
  switch(currentMode){
    case "read":
      html = `<div class="word-text">${w.en}</div><div class="meaning-text" id="readMeaning"></div>`;
      break;
    case "saycn":
      html = `<div class="word-text">${w.en}</div><div class="meaning-text" id="showMeaning"></div><button class="mic-btn" onclick="startRecognition()">🎤</button>`;
      break;
    case "sayen":
      html = `<div class="word-text" id="sayEnWord"></div><div class="meaning-text say-eng-meaning" id="sayEnMeaning"></div><button class="mic-btn" onclick="startRecognition()">🎤</button>`;
      break;
    case "listen":
      html = `<div class="word-text" id="listenWord"></div><div class="meaning-text listen-meaning" id="listenMeaning"></div><button class="mic-btn" onclick="startRecognition()">🎤</button>`;
      break;
    case "spell":
      html = `<div class="word-text">拼写出单词</div><input class="spell-input" id="spellInput" placeholder="输入英文" oninput="spellCheck(this.value)" autocomplete="off"><div id="spellResult"></div>`;
      document.getElementById("spellInput").focus();
      break;
  }
  contentEl.innerHTML = html;
}

// 语音识别（即时反应）
let recognition;
if(window.webkitSpeechRecognition){
  recognition = new webkitSpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = "zh-CN";
  recognition.onresult = (e)=>{
    const res = e.results[0][0].transcript.trim().toLowerCase();
    judgeAnswer(res);
  }
}
function startRecognition(){
  if(!recognition) return alert("浏览器不支持语音识别");
  recognition.start();
}

// 答案判断
function judgeAnswer(userInput){
  const w = wordList[currentIndex];
  let ok = false;
  if(currentMode === "read"){
    ok=true;
    contentEl.querySelector("#readMeaning").innerHTML = `<span class="correct">${renderMeaning(w.cn)}</span>`;
    playSound(audioCorrect);
    setTimeout(nextWord, 600);
  }else if(currentMode === "saycn"){
    ok = userInput.includes(w.cn.split(";")[0].trim());
    if(ok){
      contentEl.querySelector("#showMeaning").innerHTML = `<span class="correct">${renderMeaning(w.cn)}</span>`;
      playSound(audioCorrect);
    }else{
      contentEl.querySelector("#showMeaning").innerHTML = `<span class="wrong">回答错误</span>`;
    }
  }else if(currentMode === "sayen"){
    ok = userInput === w.en.toLowerCase();
    if(ok){
      contentEl.querySelector("#sayEnWord").innerHTML = `<span class="correct">${w.en}</span>`;
      contentEl.querySelector("#sayEnMeaning").innerHTML = `<span>${renderMeaning(w.cn)}</span>`;
      playSound(audioCorrect);
    }else{
      contentEl.querySelector("#sayEnWord").innerHTML = `<span class="wrong">${w.en}</span>`;
    }
  }else if(currentMode === "listen"){
    ok = userInput === w.en.toLowerCase();
    if(ok){
      contentEl.querySelector("#listenWord").innerHTML = `<span class="correct">${w.en}</span>`;
      contentEl.querySelector("#listenMeaning").innerHTML = `<span>${renderMeaning(w.cn)}</span>`;
      playSound(audioCorrect);
    }else{
      contentEl.querySelector("#listenWord").innerHTML = `<span class="wrong">${w.en}</span>`;
    }
  }
  if(ok && currentMode !== "read") setTimeout(nextWord, 600);
}

// SPELL WORDS 实时输入校验（全部小写）
function spellCheck(val){
  const w = wordList[currentIndex];
  const lowVal = val.toLowerCase();
  const resEl = document.getElementById("spellResult");
  if(lowVal === w.en.toLowerCase()){
    resEl.innerHTML = `<div class="word-text correct">${w.en}</div><div class="meaning-text">${renderMeaning(w.cn)}</div>`;
    playSound(audioCorrect);
    setTimeout(nextWord,600);
  }else if(w.en.startsWith(lowVal)){
    resEl.innerHTML = `<span style="color:#666">继续输入...</span>`;
  }else{
    resEl.innerHTML = `<span class="wrong">拼写不对</span>`;
  }
}

// 下一题
function nextWord(){
  currentIndex++;
  if(currentIndex >= wordList.length){
    // 完成一组：对话气泡，播放完成音效
    playSound(audioFinish);
    contentEl.innerHTML = `
      <div class="chat-box">
        <div class="bubble-left">Well, I've finished.</div>
        <div class="bubble-right">I knew it. You're the best.</div>
      </div>`;
    currentIndex = 0;
    return;
  }
  renderWord();
}

// 设置面板开关
document.getElementById("settingBtn").onclick = ()=>{
  document.getElementById("settingPanel").classList.add("open");
  document.getElementById("overlay").classList.add("show");
};
document.getElementById("closeSetting").onclick = closeSetting;
document.getElementById("overlay").onclick = closeSetting;
function closeSetting(){
  document.getElementById("settingPanel").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}
document.getElementById("nextBtn").onclick = nextWord;

// 初始化
renderWord();
</script>
</body>
</html>
