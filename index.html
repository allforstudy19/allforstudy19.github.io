<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>单词练习工具</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="white">
<meta name="apple-mobile-web-app-title" content="单词练习">
<link rel="apple-touch-icon" href="icon.png">
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  background-color: #ffffff;
  min-height: 100vh;
  overflow-x: hidden;
}

body {
  padding: 16px;
  padding-bottom: 120px;
}

.app-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding-top: 8px;
}

.mode-tag {
  display: inline-block;
  background: #007AFF;
  color: #ffffff;
  font-family: "幼圆", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  padding: 6px 14px;
  border-radius: 999px;
  letter-spacing: 1px;
  margin-bottom: 14px;
}

/* 中间大卡片：和底部长条同一套白色圆角 UI */
.word-card {
  background: #ffffff;
  border-radius: 28px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  padding: 48px 20px;
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* 卡片滑动层 */
.card-inner {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  transition: transform 0.35s ease, opacity 0.35s ease;
  will-change: transform;
}

.card-inner.dragging {
  transition: none;
}

.card-inner.fly-left {
  transform: translateX(-120%) rotate(-3deg);
  opacity: 0;
}

.card-inner.fly-right {
  transform: translateX(120%) rotate(3deg);
  opacity: 0;
}

#wordTextDisplay {
  font-size: clamp(40px, 11vw, 96px);
  color: #000000;
  font-weight: 500;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  line-height: 1.2;
}

#answerTip {
  margin-top: 16px;
  font-size: clamp(20px, 5vw, 32px);
  color: #000000;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  line-height: 1.4;
}

.hint-text {
  font-size: 20px;
  color: #8e8e93;
  margin-bottom: 12px;
}

.countdown-dot {
  position: absolute;
  top: 18px;
  right: 20px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #007AFF;
}

/* 底部长条 */
.bottom-dock {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 16px;
  background: #ffffff;
  border-radius: 24px;
  padding: 10px 12px;
  display: flex;
  gap: 8px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
  z-index: 50;
}

.dock-btn {
  width: 54px;
  height: 54px;
  background: #ffffff;
  border: 1px solid #f0f0f3;
  border-radius: 16px;
  color: #007AFF;
  font-family: "幼圆", "Microsoft YaHei", sans-serif;
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease;
}

.dock-btn:active {
  transform: scale(0.94);
  background: #f2f2f7;
}

/* 设置面板 */
.setting-panel {
  position: fixed;
  bottom: calc(16px + 70px + 10px);
  right: 16px;
  width: 220px;
  max-width: 86vw;
  background: #ffffff;
  border: 1px solid #e5e5ea;
  border-radius: 18px;
  overflow: hidden;
  display: none;
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.14);
  z-index: 80;
}

.setting-panel.show {
  display: block;
}

.setting-item {
  padding: 14px 18px;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  color: #000000;
  font-size: 16px;
  border-bottom: 1px solid #f1f1f3;
  cursor: pointer;
  white-space: nowrap;
}

.setting-item:last-child {
  border-bottom: none;
}

.import-area {
  padding: 14px 18px;
}

.import-area textarea {
  width: 100%;
  height: 110px;
  padding: 12px;
  border: 1px solid #d2d2d7;
  border-radius: 14px;
  font-size: 14px;
  outline: none;
  margin-bottom: 10px;
  font-family: inherit;
}

.import-area input[type="file"] {
  font-size: 13px;
  color: #007AFF;
}

/* 气泡 */
.chat-box {
  display: flex;
  flex-direction: column;
  gap: 18px;
  width: 100%;
  padding: 10px;
}

.bubble-right {
  position: relative;
  align-self: flex-end;
  background: #007AFF;
  color: #fff;
  padding: 12px 16px;
  border-radius: 18px 6px 18px 18px;
  max-width: 72%;
  font-size: 16px;
}

.bubble-right::after {
  content: "";
  position: absolute;
  right: -8px;
  bottom: 2px;
  border-width: 8px 0 0 8px;
  border-style: solid;
  border-color: transparent transparent transparent #007AFF;
}

.bubble-left {
  position: relative;
  align-self: flex-start;
  background: rgba(120, 120, 128, 0.12);
  backdrop-filter: blur(10px);
  color: #000;
  padding: 12px 16px;
  border-radius: 6px 18px 18px 18px;
  max-width: 72%;
  font-size: 16px;
}

.bubble-left::after {
  content: "";
  position: absolute;
  left: -8px;
  bottom: 2px;
  border-width: 8px 8px 0 0;
  border-style: solid;
  border-color: transparent rgba(120, 120, 128, 0.12) transparent transparent;
}

.fullscreen-container:-webkit-full-screen {
  background: #ffffff;
}

.fullscreen-container:-webkit-full-screen .mode-tag,
.fullscreen-container:-webkit-full-screen .setting-panel,
.fullscreen-container:-webkit-full-screen .bottom-dock {
  display: none !important;
}
</style>
</head>

<body>
<div class="fullscreen-container" id="fullWrap">
  <div class="app-wrap">
    <div class="mode-tag" id="modeTag">准备开始</div>

    <div class="word-card" id="wordCard">
      <div class="countdown-dot" id="countdownDot"></div>
      <div class="card-inner" id="cardInner">
        <div id="wordTextDisplay">准备开始</div>
        <div id="answerTip"></div>
      </div>
    </div>
  </div>
</div>

<div class="setting-panel" id="settingPanel">
  <div class="setting-item" id="importWord">导入单词</div>
  <div class="setting-item" data-mode="listenWrite">LISTEN AND WRITE</div>
  <div class="setting-item" data-mode="sayChinese">SAY CHINESE</div>
  <div class="setting-item" data-mode="sayEnglish">SAY ENGLISH</div>
  <div class="import-area" id="importBlock">
    <textarea id="wordInput">apple,苹果|苹果树
banana,香蕉
cat,猫
dog,狗
book,书</textarea>
    <input type="file" id="fileUpload" accept=".txt" />
  </div>
</div>

<div class="bottom-dock" id="dockWrap">
  <button class="dock-btn" id="startBtn">START</button>
  <button class="dock-btn" id="lastBtn">LAST</button>
  <button class="dock-btn" id="nextBtn">NEXT</button>
  <button class="dock-btn" id="finishBtn">FINISH</button>
  <button class="dock-btn" id="fullBtn">全屏</button>
  <button class="dock-btn" id="settingBtn">设置</button>
</div>

<script>
const modeTag = document.getElementById("modeTag");
const wordCard = document.getElementById("wordCard");
const cardInner = document.getElementById("cardInner");
const wordTextDisplay = document.getElementById("wordTextDisplay");
const answerTip = document.getElementById("answerTip");
const countdownDot = document.getElementById("countdownDot");
const settingBtn = document.getElementById("settingBtn");
const settingPanel = document.getElementById("settingPanel");
const importWordItem = document.getElementById("importWord");
const importBlock = document.getElementById("importBlock");
const wordInput = document.getElementById("wordInput");
const fileUpload = document.getElementById("fileUpload");
const fullWrap = document.getElementById("fullWrap");

const startBtn = document.getElementById("startBtn");
const lastBtn = document.getElementById("lastBtn");
const nextBtn = document.getElementById("nextBtn");
const finishBtn = document.getElementById("finishBtn");
const fullBtn = document.getElementById("fullBtn");

let wordList = [];
let currentWordIndex = 0;
let gameMode = "listenWrite";
let isRunning = false;
let answerTimer = null;
let answerShown = false;

const modeNames = {
  listenWrite: "LISTEN AND WRITE",
  sayChinese: "SAY CHINESE",
  sayEnglish: "SAY ENGLISH"
};

function renderMeaning(arr) {
  return arr.join("<br>");
}

function speakText(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.9;
  speechSynthesis.speak(u);
}

settingBtn.onclick = () => {
  settingPanel.classList.toggle("show");
};

importWordItem.onclick = () => {
  importBlock.style.display = importBlock.style.display === "none" ? "block" : "none";
};

document.querySelectorAll(".setting-item[data-mode]").forEach(item => {
  item.onclick = () => {
    gameMode = item.dataset.mode;
    modeTag.textContent = modeNames[gameMode];
    settingPanel.classList.remove("show");
    resetDisplay();
  };
});

function parseWords() {
  const lines = wordInput.value.trim().split("\n");
  const arr = [];
  lines.forEach(line => {
    const sp = line.split(/[,，]/);
    if (sp.length >= 2) {
      const cnArr = sp[1].trim().split(/[|｜]/).map(s => s.trim());
      arr.push({ en: sp[0].trim(), cn: cnArr });
    }
  });
  return arr;
}

fileUpload.onchange = function (e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    wordInput.value = evt.target.result;
  };
  reader.readAsText(file);
};

function resetDisplay() {
  clearTimeout(answerTimer);
  answerTip.textContent = "";
  answerTip.className = "";
  answerShown = false;
}

function showCardAfterAnimation(direction, callback) {
  cardInner.classList.add(direction === "next" ? "fly-left" : "fly-right");

  setTimeout(() => {
    callback();
    cardInner.classList.remove("fly-left", "fly-right");
  }, 320);
}

function loadWord(direction = "next") {
  resetDisplay();

  if (currentWordIndex >= wordList.length) {
    finishPractice();
    return;
  }

  if (currentWordIndex < 0) {
    currentWordIndex = 0;
  }

  const w = wordList[currentWordIndex];

  showCardAfterAnimation(direction, () => {
    if (gameMode === "listenWrite") {
      wordTextDisplay.textContent = "准备听并写";
      answerTip.textContent = "";
      speakText(w.en);

      answerTimer = setTimeout(() => {
        wordTextDisplay.textContent = w.en;
        answerTip.innerHTML = renderMeaning(w.cn);
        answerShown = true;
      }, 5000);
    }

    if (gameMode === "sayChinese") {
      wordTextDisplay.textContent = w.en;
      answerTip.textContent = "";

      answerTimer = setTimeout(() => {
        answerTip.innerHTML = renderMeaning(w.cn);
        answerShown = true;
      }, 5000);
    }

    if (gameMode === "sayEnglish") {
      wordTextDisplay.innerHTML = `<span>${renderMeaning(w.cn)}</span>`;
      answerTip.textContent = "";

      answerTimer = setTimeout(() => {
        wordTextDisplay.textContent = w.en;
        answerShown = true;
      }, 5000);
    }
  });
}

function goNext() {
  if (!isRunning) return;
  currentWordIndex++;
  loadWord("next");
}

function goLast() {
  if (!isRunning) return;
  currentWordIndex--;
  loadWord("last");
}

function finishPractice() {
  isRunning = false;
  resetDisplay();

  wordTextDisplay.innerHTML = `
    <div class="chat-box">
      <div class="bubble-right">Well, I've finished.</div>
      <div class="bubble-left">I knew it. You're the best.</div>
    </div>`;
  answerTip.textContent = "";
}

startBtn.onclick = () => {
  wordList = parseWords();
  if (wordList.length === 0) {
    alert("请先导入单词！");
    return;
  }
  isRunning = true;
  currentWordIndex = 0;
  modeTag.textContent = modeNames[gameMode];
  loadWord("next");
};

lastBtn.onclick = goLast;
nextBtn.onclick = goNext;

finishBtn.onclick = () => {
  if (isRunning) {
    finishPractice();
  }
};

fullBtn.onclick = async () => {
  try {
    if (!document.fullscreenElement) {
      await fullWrap.requestFullscreen();
    } else {
      await document.exitFullscreen();
    }
  } catch (e) {
    alert("全屏切换失败");
  }
};

document.addEventListener("click", (e) => {
  if (!settingPanel.contains(e.target) && e.target !== settingBtn) {
    settingPanel.classList.remove("show");
  }
});

/* 卡片左滑右滑 */
let startX = 0;
let currentX = 0;
let dragging = false;

wordCard.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
  dragging = true;
  cardInner.classList.add("dragging");
}, { passive: true });

wordCard.addEventListener("touchmove", e => {
  if (!dragging) return;
  currentX = e.touches[0].clientX;
  const diff = currentX - startX;
  cardInner.style.transform = `translateX(${diff}px)`;
}, { passive: true });

wordCard.addEventListener("touchend", () => {
  if (!dragging) return;
  dragging = false;
  cardInner.classList.remove("dragging");

  const diff = currentX - startX;

  if (diff < -60) {
    goNext();
  } else if (diff > 60) {
    goLast();
  }

  setTimeout(() => {
    cardInner.style.transform = "";
  }, 320);
});
</script>
</body>
</html>
